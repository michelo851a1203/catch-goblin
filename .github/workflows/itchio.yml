name: itch.io build & Cloudflare deploy

# 只監聽 itchio 分支（2026-11-25 起由 crazy-game 改為 itchio）；main 分支的 GitHub Pages 部署（deploy.yml）不受影響
#
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   Secrets
#     CLOUDFLARE_API_TOKEN：具有「Workers Scripts: Edit」與「Cloudflare Pages: Edit」權限的 API token
#     CLOUDFLARE_ACCOUNT_ID：Cloudflare 帳號 ID
#   Variables
#     VITE_TURN_URL：TURN Worker 的網址，例如 https://elf-and-goblins-turn.<子網域>.workers.dev/ice
#     SITE_URL（選填）：網站版的正式網址，預設 https://elf-and-goblins.pages.dev/；綁自訂網域後改這裡
# TURN 金鑰（TURN_KEY_ID / TURN_KEY_API_TOKEN）只設定在 Worker 上，不放在 GitHub
on:
  push:
    branches: [itchio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itchio
  cancel-in-progress: true

jobs:
  # TURN 憑證 Worker：遊戲多人連線用
  turn:
    # 手動觸發時若選了其他分支就不執行
    if: github.ref == 'refs/heads/itchio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Deploy TURN worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/turn
          command: deploy

  build:
    if: github.ref == 'refs/heads/itchio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}

      # 下載後解壓得到的就是遊戲檔案，重新壓成 zip（index.html 在最上層）即可上傳到 itch.io
      # 排除項目與 package:itch 相同
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itchio-build
          path: |
            dist
            !dist/elf-preview.html
            !dist/assets/elfPreview-*
          retention-days: 30

      # 網站版：同一份程式碼再建置一次，設定 SITE_URL 注入 SEO / 社群卡片 / robots / sitemap，並拿掉 CrazyGames SDK（見 site/plugin.ts）。
      # 上面上傳的 itchio-build artifact 已經建置完成，不受影響
      - name: Build website (SEO + social cards)
        run: bun run build
        env:
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://elf-and-goblins.pages.dev/' }}

      # 網站版建置結果交給下面的 deploy-website job；Cloudflare token 不進入跑 bun install / 測試 / 建置的 job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-build
          path: dist
          retention-days: 1

  # 網站：https://elf-and-goblins.pages.dev
  # --branch 必須等於 Cloudflare Pages 專案設定的正式（production）分支，否則只會部署成 Preview、正式網址不會更新
  # 只下載已建置好的網站檔案並執行 wrangler，不 checkout、不安裝相依套件
  deploy-website:
    if: github.ref == 'refs/heads/itchio'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-build
          path: dist

      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elf-and-goblins --branch=itchio
