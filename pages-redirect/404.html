<!doctype html>
<!-- GitHub Pages 已停止部署遊戲本體，一律轉址到正式網站（Cloudflare Pages），避免與正式網站的內容重複。
     GitHub Pages 不支援伺服器端 301，改用 meta refresh（搜尋引擎視為永久轉址）+ canonical；有 JS 時保留網址參數（例如 ?role=elf） -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Elf &amp; Goblins has moved</title>
    <link rel="canonical" href="https://elf-and-goblins.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://elf-and-goblins.pages.dev/" />
    <script>
      location.replace('https://elf-and-goblins.pages.dev/' + location.search + location.hash)
    </script>
  </head>
  <body style="background:#0b1411;color:#f1e6c8;font-family:Georgia,serif;text-align:center;padding-top:20vh">
    <p>Elf &amp; Goblins has moved to <a style="color:#f2cf74" href="https://elf-and-goblins.pages.dev/">elf-and-goblins.pages.dev</a>.</p>
  </body>
</html>
