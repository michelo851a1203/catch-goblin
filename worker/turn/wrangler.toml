# Cloudflare TURN 憑證 Worker（見 README「多人連線設定」）
# 部署：GitHub Actions（.github/workflows/itchio.yml）在 itchio 分支推送時自動部署
#   注意：crazy-game 分支上仍有舊的 crazygames.yml，推 crazy-game 會用那邊的設定覆蓋這裡（拿掉 itch.io），
#   暫停 CrazyGames 期間不要推 crazy-game 分支
# 金鑰用 secret 設定，不要寫在這裡：
#   bunx wrangler secret put TURN_KEY_ID
#   bunx wrangler secret put TURN_KEY_API_TOKEN
name = "elf-and-goblins-turn"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# itch.io 的 HTML5 遊戲在 iframe 裡執行，來源是 https://html-classic.itch.zone；pages.dev 是網站版
# CrazyGames 暫停上架（2026-11-24），已移除 https://*.crazygames.com；之後回去再加回來
# 正式環境不允許 localhost。本機用 `wrangler dev` 測 Worker 時，在 worker/turn/.dev.vars 覆寫：
#   ALLOWED_ORIGINS="http://localhost:5173,http://localhost:4173"
# （本機 `bun run dev` 連不到正式 Worker 時會自動退回 STUN，同一台電腦 / 同網段的多人連線不受影響）
ALLOWED_ORIGINS = "https://*.itch.zone,https://elf-and-goblins.pages.dev"
# 憑證有效 2 小時（遊戲端到期前 1 小時換新，所以必須大於 3600）
TURN_TTL = "7200"

# 限流：同一個 IP 每 60 秒最多 30 次（學校 / 網咖可能很多玩家共用一個 IP，不要設太低）。
# 遊戲端會快取憑證約 1 小時，正常玩家一次遊玩只會呼叫 1 次左右
# 用 unsafe.bindings 寫法，wrangler 3 / 4 都支援
[[unsafe.bindings]]
name = "ICE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
